name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Vérifier les règles du jeu
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace

      - name: Construire
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Sudoku.apk

      - name: Garder l'APK avec cette construction
        uses: actions/upload-artifact@v4
        with:
          name: Sudoku-apk
          path: Sudoku.apk

      - name: Publier la version à télécharger
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sudoku 1.0.${{ github.run_number }}
          body: |
            Pour installer : télécharge **Sudoku.apk** depuis ton téléphone, ouvre-le, puis accepte l'installation.
          files: Sudoku.apk
          make_latest: true
